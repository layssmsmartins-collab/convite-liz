schema_version: "1.1"
name: menopausei-rotulo
expected_outcome: |
  Um relatório com veredito por queixa (sono, esquecer palavras, irritabilidade, e as que a marca promete: fogachos, energia), olhando a fórmula inteira. Deve dizer que triptofano 200 mg e magnésio 63 mg estão abaixo do piso dos estudos para sono, que lecitina de soja 200 mg não é isoflavona em dose relevante, que D3 50 mcg e B6/B12 altas podem ajudar quem tem deficiência (ajuda em parte), que curcumina 285 mg é a única dose real e não cobre as queixas centrais, e explicar por que depoimentos não distinguem efeito de placebo. Deve apontar riscos regulatórios (alegações de efeito, constituintes a confirmar, %VD deslocado) e listar o que não foi checado.
