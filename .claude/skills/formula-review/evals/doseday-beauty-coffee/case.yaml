schema_version: "1.1"
name: doseday-beauty-coffee
expected_outcome: |
  Veredito "Atrapalha" ou "Não resolve" para sono (cafeína + taurina em dose de energético, horário), "Ajuda em parte" transitória para cansaço (cafeína dá energia aguda, não trata a causa), "Não resolve" para irritabilidade e esquecer palavras; colágeno 2,5 g lido como abaixo da dose dos estudos de pele (e irrelevante para as queixas). Deve dizer claramente que é uma fórmula de energia/beleza, não de perimenopausa, que a cafeína não declarada é um problema de leitura e regulatório, e que copiar o formato (sachê, ritual) é separado de copiar a fórmula. Deve apontar as alegações proibidas.
